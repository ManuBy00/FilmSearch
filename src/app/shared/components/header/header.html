<header class="main-header">
  <div class="header-container">
    <svg 
      class="header-icon" 
      xmlns="http://www.w3.org/2000/svg" 
      viewBox="0 0 24 24" 
      fill="none" 
      stroke="currentColor" 
      stroke-width="2" 
      stroke-linecap="round" 
      stroke-linejoin="round">
      <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/>
      <path d="M7 8v2m4-2v2m4-2v2M3 12h18"/>
    </svg>
    
    <h1 class="header-title">CineCatalogo</h1>

    <nav>
      <a href="">Inicio</a>
      <a href="">Favoritos</a>
    </nav>
  </div>

  <div>
    <app-search></app-search>
  </div>
</header>

@if (title()!="") {
  <div class="post-header">
    <h1 class="tittle">{{title()}}</h1>
    <h1 class="subtittle">{{subtittle()}}</h1>
</div>
}
